# 単体テスト・lint・debug ビルドを、push と pull request のたびに GitHub 上で実行する（署名鍵は使わない）。
# Android 10 用（android10）〜 Android 15 用（android15）のすべての版で行う
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Gradle ラッパー（gradle-wrapper.jar）が公式のものか確かめる
      - uses: gradle/actions/wrapper-validation@v6
      # JDK 21 と Gradle のキャッシュ。キャッシュは setup-java の機能を使う
      # （gradle/actions v6 の setup-gradle のキャッシュは、別の利用規約の部品になったため使わない）
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Unit tests, lint and debug build
        run: >-
          ./gradlew --console=plain
          testAndroid10DebugUnitTest testAndroid11DebugUnitTest testAndroid12DebugUnitTest testAndroid13DebugUnitTest testAndroid14DebugUnitTest testAndroid15DebugUnitTest
          lintAndroid10Debug lintAndroid11Debug lintAndroid12Debug lintAndroid13Debug lintAndroid14Debug lintAndroid15Debug assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
