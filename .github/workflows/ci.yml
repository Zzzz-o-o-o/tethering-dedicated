# 単体テスト・lint・debug ビルドを、push と pull request のたびに GitHub 上で実行する（署名鍵は使わない）
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Gradle のキャッシュと、ラッパー（gradle-wrapper.jar）の検証
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
